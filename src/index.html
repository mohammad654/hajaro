<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Hajaro Coaching — Bodybuilding Coach & Personal Trainer</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta
      name="description"
      content="Online and in-person bodybuilding coaching with individual training programs, nutrition guidance and weekly check-ins."
    />
    <meta name="theme-color" content="#0b0b0c" />
    <meta name="color-scheme" content="dark" />
    <meta name="format-detection" content="telephone=no" />

    <link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png" />
    <link rel="icon" type="image/svg+xml" href="icons/icon.svg" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />

    <!-- Self-hosted fonts (src/styles/_fonts.scss). Preload only what the first screen uses:
         body text (Inter) and the h1 weight (Barlow Condensed 800). -->
    <link
      rel="preload"
      href="/fonts/inter-latin-var.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="/fonts/barlow-condensed-latin-800.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
  </head>
  <body>
    <app-root></app-root>
    <noscript>
      <p style="padding: 1rem; color: #f4f4f5; background: #0b0b0c">
        Interactive tools on this site (the muscle chart, planner and calculators) require
        JavaScript.
      </p>
    </noscript>
  </body>
</html>
