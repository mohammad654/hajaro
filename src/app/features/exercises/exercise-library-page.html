<app-page-hero
  i18n-eyebrow
  eyebrow="Exercise library"
  i18n-title
  title="Learn every exercise properly"
  i18n-lead
  lead="Step-by-step technique, the muscles each exercise trains, suggested sets and reps, common mistakes and safety notes."
  [breadcrumbs]="breadcrumbs"
  imageSrc="images/home/markusspiske-fitness-594143_1920.jpg"
  i18n-imageAlt
  imageAlt="Row of heavy dumbbells on a gym rack"
/>

<section class="section section--tight">
  <div class="container">
    <form
      class="toolbar"
      role="search"
      i18n-aria-label
      aria-label="Search exercises"
      (submit)="$event.preventDefault()"
    >
      <div class="search">
        <label for="ex-search" class="visually-hidden" i18n>Search exercises</label>
        <app-icon name="search" class="search__icon" />
        <input
          id="ex-search"
          class="input"
          type="search"
          i18n-placeholder
          placeholder="Search by exercise or muscle"
          autocomplete="off"
          [value]="query()"
          (input)="query.set(readValue($event))"
        />
      </div>
      <div class="field">
        <label for="ex-muscle" class="visually-hidden" i18n>Muscle</label>
        <select
          id="ex-muscle"
          class="select"
          [value]="muscle()"
          (change)="muscle.set(readValue($event))"
        >
          <option value="" i18n>All muscles</option>
          @for (m of muscles.all; track m.id) {
            <option [value]="m.id">{{ m.name }}</option>
          }
        </select>
      </div>
      <div class="field">
        <label for="ex-equipment" class="visually-hidden" i18n>Equipment</label>
        <select
          id="ex-equipment"
          class="select"
          [value]="equipment()"
          (change)="equipment.set($any(readValue($event)))"
        >
          <option value="" i18n>All equipment</option>
          @for (o of equipmentOptions; track o[0]) {
            <option [value]="o[0]">{{ o[1] }}</option>
          }
        </select>
      </div>
      <div class="field">
        <label for="ex-difficulty" class="visually-hidden" i18n>Difficulty</label>
        <select
          id="ex-difficulty"
          class="select"
          [value]="difficulty()"
          (change)="difficulty.set($any(readValue($event)))"
        >
          <option value="" i18n>All levels</option>
          @for (o of difficultyOptions; track o[0]) {
            <option [value]="o[0]">{{ o[1] }}</option>
          }
        </select>
      </div>
    </form>

    <nav class="categories" i18n-aria-label aria-label="Exercise categories">
      <button
        type="button"
        class="chip"
        [attr.aria-pressed]="category() === ''"
        (click)="category.set('')"
        i18n
      >
        All
      </button>
      @for (c of categories; track c[0]) {
        <button
          type="button"
          class="chip"
          [attr.aria-pressed]="category() === c[0]"
          (click)="toggleCategory(c[0])"
        >
          {{ c[1] }}
        </button>
      }
    </nav>

    <div class="results-bar">
      <p aria-live="polite" i18n>
        {filtered().length, plural, =1 {1 exercise} other {{{ filtered().length }} exercises}}
      </p>
      <button type="button" class="btn btn--ghost btn--sm" (click)="reset()" i18n>
        Clear filters
      </button>
    </div>

    @if (visible().length) {
      <div class="grid grid--3">
        @for (exercise of visible(); track exercise.id) {
          <app-exercise-card [exercise]="exercise" />
        }
      </div>
      <app-paginator
        [page]="page()"
        [pageSize]="pageSize"
        [total]="filtered().length"
        (pageChange)="page.set($event)"
      />
    } @else {
      <div class="card empty">
        <h2 i18n>No exercises found</h2>
        <p class="text-muted" i18n>Try another search term, or clear the filters.</p>
        <button type="button" class="btn" (click)="reset()" i18n>Clear filters</button>
      </div>
    }
  </div>
</section>
